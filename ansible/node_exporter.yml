---
- name: Install node_exporter
  hosts: all
  become: true

  vars:
    node_exporter_version: "1.9.1"
    node_exporter_dir: "node_exporter-{{ node_exporter_version }}.linux-amd64"

  tasks:
    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        create_home: false
        shell: /sbin/nologin

    - name: Install tar
      ansible.builtin.dnf:
        name: tar
        state: present

    - name: Download node_exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_dir }}.tar.gz"
        dest: "/tmp/{{ node_exporter_dir }}.tar.gz"
        mode: "0644"

    - name: Extract node_exporter
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_dir }}.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/{{ node_exporter_dir }}/node_exporter"

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_dir }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter

    - name: Deploy node_exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus node_exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter --web.listen-address={{ ansible_host }}:9100
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    - name: Check metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9100/metrics"
        status_code: 200
      register: ne_check
      until: ne_check.status == 200
      retries: 5
      delay: 3

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        state: restarted
        daemon_reload: true
