---
- name: Configure PostgreSQL users and databases
  hosts: pgsql
  become: true
  vars_files:
    - secrets.yml
  vars:
    psql: /usr/pgsql-17/bin/psql

  tasks:
    - name: Check if this node is Primary
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/primary"
        status_code: [200, 503]
      register: patroni_role

    - name: Run SQL on Primary only
      when: patroni_role.status == 200
      block:
        - name: Copy SQL scripts
          ansible.builtin.copy:
            src: "sqls/{{ item }}"
            dest: "/tmp/{{ item }}"
            owner: postgres
            mode: "0600"
          loop:
            - test-user.sql
            - pgstat.sql
            - svcmon.sql

        - name: Create test_user and test_db1
          ansible.builtin.command: >
            {{ psql }} -v ON_ERROR_STOP=1
            -v test_user_password={{ pg_test_user_password }}
            -f /tmp/test-user.sql
          become_user: postgres
          no_log: true
          changed_when: false

        - name: Create pg_stat_statements extension
          ansible.builtin.command: >
            {{ psql }} -v ON_ERROR_STOP=1 -d {{ item }}
            -f /tmp/pgstat.sql
          become_user: postgres
          loop:
            - postgres
            - test_db1
          changed_when: false

        - name: Check pg_stat_statements settings
          ansible.builtin.command: >
            {{ psql }} -Atc "select name || ' = ' || setting from pg_settings
            where name in ('shared_preload_libraries', 'pg_stat_statements.track')"
          become_user: postgres
          register: pgss_settings
          changed_when: false

        - name: Show pg_stat_statements settings
          ansible.builtin.debug:
            var: pgss_settings.stdout_lines

        - name: Create svc_monitoring role
          ansible.builtin.command: >
            {{ psql }} -v ON_ERROR_STOP=1
            -v monitoring_password={{ pg_monitoring_password }}
            -f /tmp/svcmon.sql
          become_user: postgres
          no_log: true
          changed_when: false
